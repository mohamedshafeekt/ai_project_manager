[project]
name = "ai-project-manager"
version = "0.1.0"
description = "Add your description here"
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "fastmcp>=4.2.5",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "langchain>=1.5.2",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-openai>=1.8.5",
    "langchain-openrouter>=0.3.0",
    "langgraph>=1.2.24",
    "langsmith>=0.16.2",
    "openai>=3.58.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
warn_return_any = false
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["app.db.models", "app.services.review_queue", "app.api.routes", "app.services.watchdog"]
disable_error_code = ["assignment", "arg-type"]

[[tool.mypy.overrides]]
module = ["app.config"]
disable_error_code = ["prop-decorator"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.6",
]
